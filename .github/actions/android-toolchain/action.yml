name: Android toolchain
description: JDK, Python and the exact Android SDK/NDK/CMake pinned by upstream.lock.json.

inputs:
  android-sdk:
    description: Install the Android SDK packages (NDK, CMake, platform, build-tools).
    default: 'true'
  node-version:
    description: Node version to install; empty skips Node entirely.
    default: ''
  npm-version:
    description: Exact npm version to pin; empty keeps the one bundled with Node.
    default: ''

runs:
  using: composite
  steps:
    - name: Read pinned tool versions
      shell: bash
      run: |
        python3 - <<'PY' >> "$GITHUB_ENV"
        import json
        android = json.load(open('upstream.lock.json'))['android']
        for key in ('ndkVersion', 'cmakeVersion', 'buildToolsVersion', 'compileSdk'):
            print(f'ST_{key.upper()}={android[key]}')
        PY

    - uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: '21'

    # Self-hosted runners (Oracle Linux) have no prebuilt python-versions
    # package, so setup-python can only be used as a fallback for the
    # GitHub-hosted images; a new enough system python is preferred.
    - name: Pin a system Python
      id: system-python
      shell: bash
      run: |
        set -euo pipefail
        # Prefer the distribution interpreter over whatever comes first on PATH:
        # on the self-hosted runner that is a user virtualenv which can be
        # rebuilt or upgraded independently of CI. Expose the winner through a
        # dedicated directory instead of prepending /usr/bin, which would
        # shadow the Temurin JDK that setup-java just put on PATH.
        for candidate in /usr/bin/python3 "$(command -v python3 || true)"; do
          [ -n "$candidate" ] && [ -x "$candidate" ] || continue
          "$candidate" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)' 2>/dev/null || continue
          mkdir -p "$RUNNER_TEMP/python-bin"
          ln -sf "$candidate" "$RUNNER_TEMP/python-bin/python3"
          echo "$RUNNER_TEMP/python-bin" >> "$GITHUB_PATH"
          echo "usable=true" >> "$GITHUB_OUTPUT"
          echo "Using $("$candidate" --version) from $candidate"
          exit 0
        done
        echo "usable=false" >> "$GITHUB_OUTPUT"
        echo "No system Python >= 3.11; falling back to actions/setup-python."

    - uses: actions/setup-python@v7.0.0
      if: steps.system-python.outputs.usable != 'true'
      with:
        python-version: '3.12'

    - uses: actions/setup-node@v7.0.0
      if: inputs.node-version != ''
      with:
        node-version: ${{ inputs.node-version }}

    - name: Pin npm
      if: inputs.node-version != '' && inputs.npm-version != ''
      shell: bash
      run: |
        if [ "$(npm --version)" != "${{ inputs.npm-version }}" ]; then
          npm install -g "npm@${{ inputs.npm-version }}"
        fi
        node --version && npm --version

    - name: Install pinned Android SDK packages
      if: inputs.android-sdk == 'true'
      shell: bash
      run: |
        set -euo pipefail
        SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK not found on this runner}}"
        # SIGPIPE on `yes` must not trip pipefail once sdkmanager stops reading.
        yes 2>/dev/null | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$SDK/cmdline-tools/latest/bin/sdkmanager" \
          "ndk;${ST_NDKVERSION}" \
          "cmake;${ST_CMAKEVERSION}" \
          "platforms;android-${ST_COMPILESDK}" \
          "build-tools;${ST_BUILDTOOLSVERSION}"
        {
          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${ST_NDKVERSION}"
        } >> "$GITHUB_ENV"
        echo "$SDK/build-tools/${ST_BUILDTOOLSVERSION}" >> "$GITHUB_PATH"
